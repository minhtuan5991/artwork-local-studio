name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test core and desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Test extension geometry
        run: node tests/extension_geometry.mjs
      - name: Build Windows installer
        run: ./tools/build.ps1 -Installer
      - name: Smoke test packaged GUI and native host
        run: python tools/smoke_release.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ArtworkLocalStudio-Windows
          path: |
            release/*/*.exe
            release/*/*.zip
            release/*/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArtworkLocalStudio-Windows
          path: packages
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; preserving the existing artifacts."
          else
            gh release create "$TAG" --repo "$REPOSITORY" --title "Artwork Local Studio $TAG" --generate-notes $(find packages -type f)
          fi
